# Deploy static Astro site to GitHub Pages (official artifact + deploy-pages flow).
# One-time repo setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Docs: https://docs.astro.build/en/guides/deploy/github/
#
# Pushes to non-protected branches still run build (below) for CI; only `main` uploads the
# Pages artifact and deploys. To allow another branch to deploy, add it under
# Settings → Environments → github-pages → Deployment branches.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, using-astro]
  pull_request:
    branches: [main, using-astro]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
